apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-gateway-deployment
  labels:
    app: nexus-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nexus-gateway
  template:
    metadata:
      labels:
        app: nexus-gateway
    spec:
      containers:
      - name: gateway
        image: nexus-frontier/gateway:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: nexus-secrets
              key: database-url
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-gateway-service
spec:
  type: LoadBalancer
  selector:
    app: nexus-gateway
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
